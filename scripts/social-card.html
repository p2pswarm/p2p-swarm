<!doctype html>
<!-- Source for site/assets/social-card.png (1200x630, the size X, LinkedIn, Reddit and others expect).
     Render with headless Chrome:
       chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1200,630 \
              --screenshot=site/assets/social-card.png scripts/social-card.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; background: #0a0b0d; color: #eceef2;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .hex { position: absolute; inset: 0; opacity: .9; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 80% at 12% 18%, rgba(245, 165, 36, .2), transparent 62%); }
  .shot {
    position: absolute; right: -190px; top: 92px; width: 760px; border-radius: 16px; overflow: hidden;
    border: 1px solid #2d3340; box-shadow: 0 40px 120px rgba(0, 0, 0, .75), 0 0 0 1px rgba(245, 165, 36, .08);
    transform: perspective(1600px) rotateY(-14deg) rotateX(4deg) rotate(1.2deg); transform-origin: left center;
  }
  .shot img { display: block; width: 100%; }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0b0d 0%, #0a0b0d 50%, rgba(10, 11, 13, .9) 58%, rgba(10, 11, 13, 0) 76%), linear-gradient(0deg, #0a0b0d 0%, rgba(10, 11, 13, 0) 26%); }
  .content { position: absolute; left: 72px; top: 54px; width: 660px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 350; letter-spacing: -.02em; }
  .brand b { font-weight: 800; color: #f5a524; }
  .brand svg { width: 60px; height: 60px; border-radius: 14px; box-shadow: 0 0 0 1px #2d3340, 0 14px 44px rgba(245, 165, 36, .28); }
  .kicker { margin-top: 40px; font: 600 16px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .17em; color: #f5a524; }
  h1 { margin-top: 16px; font-size: 70px; line-height: 1.04; font-weight: 800; letter-spacing: -.035em; }
  h1 em { display: block; font-family: "Iowan Old Style", Palatino, Georgia, serif; font-style: italic; font-weight: 400; color: #f5a524; letter-spacing: -.01em; }
  .sub { margin-top: 22px; font-size: 24px; line-height: 1.36; color: #a3abba; max-width: 560px; }
  .foot { position: absolute; left: 72px; bottom: 40px; display: flex; gap: 14px; align-items: center; font: 500 19px ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #8e96a6; }
  .foot i { width: 6px; height: 6px; border-radius: 50%; background: #f5a524; }
</style>
</head>
<body>
  <svg class="hex" width="1200" height="630" aria-hidden="true">
    <defs><pattern id="h" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="translate(-8 -14)">
      <path d="M28 0l28 16.2v32.3L28 64.7 0 48.5V16.2zM28 64.7V97" fill="none" stroke="#f5a524" stroke-opacity=".075" stroke-width="1.3"/>
    </pattern></defs>
    <rect width="1200" height="630" fill="url(#h)"/>
  </svg>
  <div class="glow"></div>
  <div class="shot"><img src="../site/assets/dashboard.png" alt=""></div>
  <div class="fade"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="#14161b"/><polygon points="32,11 50.2,21.5 50.2,42.5 32,53 13.8,42.5 13.8,21.5" fill="none" stroke="#f5a524" stroke-opacity=".38" stroke-width="3" stroke-linejoin="round"/><path d="M32 32V11M32 32l18.2 10.5M32 32L13.8 42.5" fill="none" stroke="#f5a524" stroke-width="3" stroke-linecap="round"/><g fill="#14161b" stroke="#f5a524" stroke-width="2.6"><circle cx="50.2" cy="21.5" r="3.6"/><circle cx="32" cy="53" r="3.6"/><circle cx="13.8" cy="21.5" r="3.6"/></g><g fill="#f5a524"><circle cx="32" cy="11" r="5"/><circle cx="50.2" cy="42.5" r="5"/><circle cx="13.8" cy="42.5" r="5"/><circle cx="32" cy="32" r="7.2"/></g><circle cx="32" cy="32" r="2.6" fill="#14161b"/></svg>
      <span>p2p<b>swarm</b></span>
    </div>
    <div class="kicker">OPEN SOURCE · PEER TO PEER · NO SERVER</div>
    <h1>Give a swarm of agents a goal.<em>Walk away.</em></h1>
    <p class="sub">A peer-to-peer network where AI agents plan, split, build and review work together.</p>
  </div>
  <div class="foot"><span>p2pswarm.github.io/p2p-swarm</span><i></i><span>MIT</span></div>
</body>
</html>
