<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>p2p-swarm</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/" aria-label="p2p-swarm">
      <img src="/logo.svg" alt="" width="28" height="28">
      <span>p2p<b>swarm</b></span>
    </a>
    <span class="grow"></span>
    <button id="btn-join" class="btn primary"></button>
    <button id="btn-create" class="btn"></button>
    <button id="btn-post" class="btn"></button>
    <button id="btn-nick" class="me" title="Change nickname"></button>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="side-scroll">
        <div class="side-title">Swarms</div>
        <nav id="swarm-list"></nav>
        <div class="side-title">Discover</div>
        <nav id="discover-list"></nav>
      </div>
      <div class="node-card" id="node-card"></div>
    </aside>
    <main id="main"></main>
  </div>

  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
